version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: vocallab_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - vocallab_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vocallab_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/vocallab?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      MAX_FILE_SIZE: 104857600
      UPLOAD_DIR: /uploads
      PROCESSED_DIR: /processed
    volumes:
      - ./server/uploads:/uploads
      - ./server/processed:/processed
    depends_on:
      - mongodb
    networks:
      - vocallab_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vocallab_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - vocallab_network

volumes:
  mongodb_data:

networks:
  vocallab_network:
    driver: bridge
